# FalkorDB server (6379) + Browser (3000). ACL users are config, so they survive restarts.
# Rules per docs/falkordb.md gotcha 10: read-only is granted per command, never %R~.
# +INFO +CLIENT|SETINFO: the node redis client sends both on connect.
# appendfsync always: the Pi Durable journal (MOCHI_STORAGE=falkordb) acks a commit only after fsync, so a crash
# never loses a batch the harness already treated as committed (everysec could drop the last second).
services:
  falkordb:
    image: falkordb/falkordb:v4.22.1
    ports: ["127.0.0.1:6379:6379", "127.0.0.1:3000:3000"] # dev: localhost only
    environment:
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:?}   # read by the healthcheck
      REDIS_ARGS: >-
        --requirepass ${FALKORDB_PASSWORD:?set FALKORDB_PASSWORD in .env}
        --appendonly yes --appendfsync always
        --save 900 1 --save 300 10 --save 60 1000
        --user mochi_reader on >${MOCHI_READER_PASSWORD:?} resetkeys ~mochi_company ~team_* ~mochi_journal resetchannels -@all +GRAPH.RO_QUERY +GRAPH.EXPLAIN +GRAPH.LIST +PING +INFO +CLIENT|SETINFO
        --user mochi_dream on >${MOCHI_DREAM_PASSWORD:?} resetkeys ~mochi_company ~mochi_company_prev ~algo_scratch ~team_* resetchannels -@all +GRAPH.QUERY +GRAPH.RO_QUERY +GRAPH.EXPLAIN +GRAPH.COPY +GRAPH.DELETE +GRAPH.CONSTRAINT +GRAPH.LIST +PING +INFO +CLIENT|SETINFO
        --user mochi_journal on >${MOCHI_JOURNAL_PASSWORD:?} resetkeys ~mochi_journal resetchannels -@all +GRAPH.QUERY +GRAPH.RO_QUERY +GRAPH.EXPLAIN +GRAPH.LIST +PING +INFO +CLIENT|SETINFO
        --user user_demo on >${MOCHI_DEMO_USER_PASSWORD:?} resetkeys ~mochi_company resetchannels -@all +GRAPH.RO_QUERY +GRAPH.LIST +PING +INFO +CLIENT|SETINFO (~user_demo ~cust_* ~team_* +GRAPH.QUERY +GRAPH.RO_QUERY)
      FALKORDB_ARGS: THREAD_COUNT 4 MAX_QUEUED_QUERIES 256 TIMEOUT_DEFAULT 30000 TIMEOUT_MAX 60000 RESULTSET_SIZE 10000 QUERY_MEM_CAPACITY 268435456
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$FALKORDB_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  falkordb_data: {}
